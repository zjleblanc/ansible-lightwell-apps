---
- name: Ensure build dependencies are installed
  become: true
  ansible.builtin.dnf:
    name:
      - podman
      - rsync
    state: present

- name: Ensure application source directory exists on the controller
  delegate_to: localhost
  register: app_source_stat
  ansible.builtin.stat:
    path: "{{ app_source_dir }}"

- name: Fail if application source is missing
  when: not app_source_stat.stat.exists
  ansible.builtin.fail:
    msg: >-
      Application source not found at {{ app_source_dir }}. This role
      expects to run against a checkout of the ansible-lightwell repository
      (e.g. the AAP project working directory).

- name: Build, tag, and push the application image with Lightwell auth
  block:
    - name: Create a remote build directory on the build host
      register: remote_build_dir
      ansible.builtin.tempfile:
        state: directory
        suffix: -lightwell-build

    - name: Sync application source to the build host
      ansible.posix.synchronize:
        src: "{{ app_source_dir }}/"
        dest: "{{ remote_build_dir.path }}/"
        recursive: true

    - name: Write Lightwell Network credentials to the build context
      ansible.builtin.include_tasks: auth_java.yml

    - name: Build the application container image
      register: build_result
      containers.podman.podman_image:
        name: "{{ app_image_registry }}/{{ app_image_name }}"
        tag: "{{ app_image_tag }}"
        path: "{{ remote_build_dir.path }}"
        build:
          file: Containerfile
          force_rm: true

    - name: Tag the image for the target environment
      containers.podman.podman_tag:
        image: "{{ app_image_registry }}/{{ app_image_name }}:{{ app_image_tag }}"
        target_names:
          - "{{ app_image_registry }}/{{ app_image_name }}:{{ app_image_latest_tag }}"

    - name: Write the registry auth file to the build host
      when: registry_auth_file is defined
      no_log: "{{ build_app_no_log }}"
      ansible.builtin.copy:
        src: "{{ registry_auth_file }}"
        dest: "{{ remote_build_dir.path }}/.registry-auth.json"
        mode: "0600"

    - name: Push the built image(s) to the registry
      when: app_image_push | bool
      loop:
        - "{{ app_image_tag }}"
        - "{{ app_image_latest_tag }}"
      containers.podman.podman_image:
        name: "{{ app_image_registry }}/{{ app_image_name }}"
        tag: "{{ item }}"
        push: true
        auth_file: "{{ (remote_build_dir.path + '/.registry-auth.json') if registry_auth_file is defined else omit }}"
  always:
    - name: Remove the remote build directory
      when: remote_build_dir is defined and remote_build_dir.path is defined
      ansible.builtin.file:
        path: "{{ remote_build_dir.path }}"
        state: absent
