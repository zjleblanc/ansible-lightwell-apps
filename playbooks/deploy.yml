---
- name: Build the Lightwell demo application image
  hosts: rhlw
  gather_facts: false

  vars:
    github_token: "{{ generic_token | default(undefined) }}"

  tasks:
    - name: Check whether the PR touches this app's files (Dev only)
      when:
        - app_environment == 'dev'
        - github_token is defined
        - github_repo_full_name is defined
        - github_pr_number is defined
      block:
        - name: Fetch the list of files changed in the pull request
          register: pr_files_result
          ansible.builtin.uri:
            url: "{{ github_api_url | default('https://api.github.com') }}/repos/{{ github_repo_full_name }}/pulls/{{ github_pr_number }}/files?per_page=100"
            method: GET
            headers:
              Authorization: "Bearer {{ github_token }}"
              Accept: application/vnd.github+json
            status_code: [200]

        - name: End play early when no files changed under apps/java
          when: pr_files_result.json | map(attribute='filename') | select('match', '^apps/java/') | list | length == 0
          vars:
            github_status_state: success
            github_status_description: "Skipped — no apps/java changes detected"
          block:
            - name: Post a success status so the PR check is not left pending
              ansible.builtin.include_role:
                name: demo.lightwell.report_status

            - name: End play
              ansible.builtin.meta: end_play

    - name: Check whether the push commit touches this app's files (Prod only)
      when:
        - app_environment == 'prod'
        - github_token is defined
        - github_repo_full_name is defined
        - app_git_sha is defined
      block:
        - name: Fetch the list of files changed in the commit
          register: commit_files_result
          ansible.builtin.uri:
            url: "{{ github_api_url | default('https://api.github.com') }}/repos/{{ github_repo_full_name }}/commits/{{ app_git_sha }}"
            method: GET
            headers:
              Authorization: "Bearer {{ github_token }}"
              Accept: application/vnd.github+json
            status_code: [200]

        - name: End play early when no files changed under apps/java
          when: commit_files_result.json.files | map(attribute='filename') | select('match', '^apps/java/') | list | length == 0
          vars:
            github_status_state: success
            github_status_description: "Skipped — no apps/java changes detected"
          block:
            - name: Post a success status so the commit check is not left pending
              ansible.builtin.include_role:
                name: demo.lightwell.report_status

            - name: End play
              ansible.builtin.meta: end_play

    - name: Mark the GitHub status check as pending
      vars:
        github_status_state: pending
        github_status_description: "Building java application image for {{ app_environment }}"
      ansible.builtin.include_role:
        name: demo.lightwell.report_status

    - name: Build the application image
      block:
        - name: Build the application image
          ansible.builtin.include_role:
            name: demo.lightwell.build_app
      rescue:
        - name: Report the build failure to GitHub so the check does not hang pending
          vars:
            github_status_state: failure
            github_status_description: "Build failed for java in {{ app_environment }} -- see AAP job output for details"
          ansible.builtin.include_role:
            name: demo.lightwell.report_status

        - name: Re-raise the build failure so the AAP job is marked failed
          ansible.builtin.fail:
            msg: >-
              Build failed for {{ app_image_registry | default('quay.io/zleblanc') }}/{{
                app_image_name | default('lightwell-java-demo') }}:{{
                app_image_tag | default(app_git_sha | default('dev')) }}.
              See the task output above for the underlying error.

- name: Deploy and verify the Lightwell demo application
  hosts: rhlw
  gather_facts: false

  vars:
    github_token: "{{ generic_token | default(undefined) }}"

  pre_tasks:
    - name: Mark the GitHub status check as pending (Prod only)
      when: app_environment == 'prod'
      vars:
        github_status_state: pending
        github_status_description: "Deploying java to {{ app_environment }}"
      ansible.builtin.include_role:
        name: demo.lightwell.report_status

  tasks:
    - name: Deploy, verify, and roll back the application
      block:
        - name: Deploy the application
          ansible.builtin.include_role:
            name: demo.lightwell.deploy_app

        - name: Run the post-deploy health check
          vars:
            health_check_strict: "{{ true if app_environment == 'dev' else false }}"
          ansible.builtin.include_role:
            name: demo.lightwell.health_check

        - name: Record the initial deployment health result
          ansible.builtin.set_fact:
            initial_health_check_passed: "{{ health_check_passed }}"

        - name: Roll back automatically when the initial health check fails (Prod only)
          when:
            - app_environment == 'prod'
            - not initial_health_check_passed
          ansible.builtin.include_role:
            name: demo.lightwell.rollback
      rescue:
        # Catches hard task failures (e.g. deploy_app/health_check/rollback errors),
        # as distinct from a graceful health_check_passed=false, so the GitHub
        # check always gets a final status instead of hanging as pending.
        - name: Record that deployment failed unexpectedly
          ansible.builtin.set_fact:
            health_check_passed: false
            deploy_failure_reason: "failed unexpectedly -- see AAP job output for details"
      always:
        - name: Report the final GitHub status check result
          vars:
            github_status_state: "{{ 'success' if health_check_passed else 'failure' }}"
            github_status_description: >-
              Java {{ app_environment }} deployment {{ 'healthy' if health_check_passed
                 else (deploy_failure_reason | default(
                   'failed -- rolled back' if (app_environment == 'prod' and not (initial_health_check_passed | default(true)) and rollback_image is defined)
                   else 'failed health checks')) }}
          ansible.builtin.include_role:
            name: demo.lightwell.report_status

        - name: Surface the outcome for AAP job output
          ansible.builtin.debug:
            msg: >-
              Java {{ app_environment }} deployment {{ 'PASSED' if health_check_passed else 'FAILED' }}
              for image {{ app_image_registry | default('quay.io/zleblanc') }}/{{
                app_image_name | default('lightwell-java-demo') }}:{{
                app_image_tag | default(app_git_sha | default('dev')) }}.

    - name: Fail the play if unhealthy after any rollback attempt
      when: not health_check_passed
      ansible.builtin.fail:
        msg: >-
          Java {{ app_environment }} deployment
          {{ deploy_failure_reason | default('failed health checks') }}.
