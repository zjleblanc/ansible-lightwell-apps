---
- name: Route Lightwell GitHub events to the correct job template
  hosts: all

  sources:
    - name: github_webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    # One rule per event. Every matching GitHub event launches the job
    # template; playbooks/deploy.yml decides per-run whether apps/java/
    # files actually changed and skips (posting a "Skipped" status) if not.

    - name: Launch build & test on new or updated pull requests
      condition: >-
        event.payload.pull_request is defined and
        event.payload.action in ["opened", "synchronize", "reopened"]
      action:
        run_job_template:
          name: Lightwell // Build & Test
          organization: Autodotes
          job_args:
            extra_vars:
              app_environment: dev
              app_git_sha: "{{ event.payload.pull_request.head.sha }}"
              github_repo_full_name: "{{ event.payload.repository.full_name }}"
              github_pr_number: "{{ event.payload.pull_request.number }}"
            scm_branch: "{{ event.payload.pull_request.head.sha }}"

    - name: Rebuild dev image on demo reset push
      condition: >-
        event.payload.ref is defined and
        event.payload.ref == "refs/heads/main" and
        event.payload.head_commit is defined and
        event.payload.head_commit.message is match("(?i)reset.*")
      action:
        run_job_template:
          name: Lightwell // Build & Test
          organization: Autodotes
          job_args:
            extra_vars:
              app_environment: dev
              app_git_sha: "{{ event.payload.after }}"
              github_repo_full_name: "{{ event.payload.repository.full_name }}"
            scm_branch: "{{ event.payload.after }}"

    - name: Launch deploy to prod on pull request merge
      condition: >-
        event.payload.ref is defined and
        event.payload.ref == "refs/heads/main" and
        (event.payload.deleted is not defined or event.payload.deleted == false) and
        event.payload.head_commit.committer.username is defined and
        event.payload.head_commit.committer.username == "web-flow"
      action:
        run_job_template:
          name: Lightwell // Deploy Prod
          organization: Autodotes
          job_args:
            extra_vars:
              app_environment: prod
              app_git_sha: "{{ event.payload.after }}"
              github_repo_full_name: "{{ event.payload.repository.full_name }}"
            scm_branch: "{{ event.payload.after }}"

    - name: Catch and Log
      condition: >-
        event.payload is defined and
        event.payload.pusher is not defined
      action:
        debug:
          var: event.payload
