---
service:
  name: Lightwell Patch Pipeline Demo
  description: >-
    A Flask dashboard demonstrating automated Python dependency patching
    sourced from the Red Hat & IBM Lightwell Network, orchestrated end-to-end
    with Renovate and Ansible Automation Platform.
  version: "2.0.2"

patch_source:
  name: Lightwell Remediated Index
  url: https://packages.redhat.com/lightwell/python/remediated/simple
  provider: Red Hat & IBM

dependencies:
  tracked:
    - name: PyYAML
      role: Loads this dashboard's configuration from this very YAML file
    - name: Jinja2
      role: Renders the dashboard templates you're looking at right now
    - name: Flask
      role: Serves the web dashboard and the /healthz endpoint
    - name: gunicorn
      role: Runs the production WSGI server inside the container
    - name: Pygments
      role: Syntax-highlights the requirements.txt snippet below

patch_timeline:
  - date: "2026-09-11"
    version: "1.0.4"
    event: Updated the UI and initiated a demo test.
  - date: "2026-08-01"
    version: "n/a"
    event: >-
      Repository configured to resolve Python dependencies through the
      Lightwell Remediated index.
  - date: "2026-07-08"
    version: "n/a"
    event: "Red Hat & IBM announce the commercial launch of Lightwell Network."
  - date: "2026-06-01"
    version: "1.0.0"
    event: "Initial release. Dependencies pinned to standard PyPI releases."
